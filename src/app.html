<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<!-- Duplicated from tokens.ts's bgApp on purpose: this paints before any
		     JS runs, so the researcher never sees a white frame before the SPA
		     hydrates, and it is what makes native scrollbars and form controls
		     render dark. -->
		<style>
			html {
				color-scheme: dark;
				background: #080b12;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
