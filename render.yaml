# T-0001-8: Render Blueprint for the backend Web Service.
#
# This is config only -- it is NOT applied to a live Render account by this
# repo. A human deploys it by following
# docs/plan/EPIC-0001/T-0001-8-deployment-runbook.md (connect the repo in
# the Render dashboard, "New +" -> "Blueprint", point it at this file).
#
# Serves the real EODHD-backed panel from Cloudflare R2 when the R2_*
# variables are set, and falls back to the mock dataset (T-0001-1's synthetic
# panel, regenerated at build time) when they are not -- see
# backend/application/load_panel.py.
#
# No persistent disk: Render's free tier doesn't support disks at all, and a
# paid tier just to attach one costs far more than storing ~60-90MB of
# Parquet in object storage (discovered live during T-0001-8 deployment).
# T-0001-9's real, non-regenerable backfilled data lives in R2 instead --
# see docs/reference/data-provider.md.
#
# MEMORY: the free plan caps the web service at 512 MB, and the panel is held
# in memory at ~26 bytes per ticker-day (backend/infra/panel_frame.py). That
# is the constraint on universe size x history length; check it with
# `scripts/backfill_panel.py --dry-run` before committing to a scope, and
# raise `plan` here if the chosen scope needs more.

services:
  - type: "web"
    name: "webmcp-pattern-research-api"
    runtime: "python"
    # Free tier is fine for validating the deploy itself; upgrade to a paid
    # plan (avoids the cold-start-after-idle behavior docs/plan.md flags as
    # a demo-recording risk) before recording the submission video.
    plan: "free"
    region: "oregon"
    rootDir: "backend"
    # uv isn't preinstalled on Render's native Python runtime; `pip install
    # uv` puts it on the same venv's PATH the platform already activates.
    # `uv sync --frozen` installs exactly what uv.lock pins -- no surprise
    # upgrades on redeploy. The mock panel is a small, deterministic,
    # seeded build artifact (see scripts/generate_mock_panel.py); generating
    # it once and leaving it on the persistent disk (skipped on redeploys
    # once present) rehearses the same "generate once, persist across
    # deploys" shape T-0001-9's real backfill + nightly delta will use,
    # which is this ticket's whole point -- validating the architecture
    # ahead of the real pipeline.
    buildCommand: >-
      pip install uv &&
      uv sync --frozen &&
      (test -f data/mock/panel.parquet || uv run python scripts/generate_mock_panel.py)
    startCommand: "uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    # T-0016-2: liveness only -- succeeds whenever the process is up and
    # serving HTTP, independent of whether a panel is loaded or which one
    # (backend/api/routes/health.py). Deliberately not /api/spike/ping,
    # which reads the mock Parquet file and builds a PriceBar on every
    # probe, and which the /api/spike stack is slated to be deleted
    # entirely (EPIC-1015) -- this path survives that deletion unchanged.
    healthCheckPath: "/health"
    envVars:
      # Secrets/deployment-specific values -- `sync: false` means Render
      # will NOT populate them from this file; a human sets the real value
      # once in the Render dashboard (see the runbook). Never commit real
      # values here.
      - key: "EODHD_API_KEY"
        sync: false
      - key: "CORS_ALLOWED_ORIGINS"
        sync: false
      # Non-secret, safe to version: see backend/main.py's
      # `_rate_limit_default` for the "<count>/<period>" syntax (AC4).
      - key: "RATE_LIMIT_DEFAULT"
        value: "60/minute"
      # T-0001-9: the R2 bucket holding the real panel. With any of these
      # unset the service still boots, serving the mock panel instead of
      # failing -- so a half-configured deploy degrades visibly (the UI
      # labels synthetic data) rather than 500ing.
      - key: "R2_BUCKET_NAME"
        sync: false
      - key: "R2_ENDPOINT_URL"
        sync: false
      - key: "R2_ACCESS_KEY_ID"
        sync: false
      - key: "R2_SECRET_ACCESS_KEY"
        sync: false

  # T-0001-9 AC2: appends the latest trading day to the stored panel, so the
  # dataset stays current with no manual step. One bulk-by-exchange EODHD
  # call per run (~100 quota units against a 100,000/day cap), NOT one call
  # per ticker -- the backfill's endpoint choice inverted, see
  # docs/reference/data-provider.md.
  #
  # Idempotent by (ticker, date): a retried run, or a manual catch-up over a
  # long weekend, replaces rows rather than duplicating them. On a market
  # holiday the provider returns no rows and the job leaves the panel
  # untouched, so no holiday calendar is needed here.
  - type: "cron"
    name: "webmcp-panel-nightly-delta"
    runtime: "python"
    plan: "starter"
    region: "oregon"
    rootDir: "backend"
    # 06:30 UTC = 02:30 ET, comfortably after the US close and after EODHD
    # publishes the day. The job asks for the most recent weekday, so a run
    # scheduled in UTC still targets the right session.
    schedule: "30 6 * * *"
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run python scripts/nightly_delta.py"
    envVars:
      - key: "EODHD_API_KEY"
        sync: false
      - key: "R2_BUCKET_NAME"
        sync: false
      - key: "R2_ENDPOINT_URL"
        sync: false
      - key: "R2_ACCESS_KEY_ID"
        sync: false
      - key: "R2_SECRET_ACCESS_KEY"
        sync: false
